name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: vet + test + frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Wails links against GTK/WebKit via cgo, so package main needs the
      # headers present even for `go vet`.
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      # main.go has //go:embed all:frontend/dist, so the Go build needs the
      # built assets to exist before vet/test can load package main.
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: go vet
        run: go vet -tags webkit2_41 ./...

      - name: go test
        run: go test -tags webkit2_41 -race -count=1 ./...
